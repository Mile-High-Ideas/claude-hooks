name: Auto Release

on:
  push:
    branches: [main]
    paths: ['cmd/**', 'justfile', 'go.mod', 'go.sum', '.github/workflows/**']

permissions:
  contents: write

jobs:
  # darwin needs the Apple SDK, which only a macOS host has, so it cannot join
  # the zig cross-compile below. macos-latest is Apple Silicon: it builds arm64
  # natively and amd64 with clang -arch x86_64 against the same SDK.
  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false  # No external deps → no go.sum → nothing to cache

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Build and package darwin
        run: just package-darwin

      - uses: actions/upload-artifact@v7
        with:
          name: darwin-archives
          path: bin/claude-hooks-darwin-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    needs: darwin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false  # No external deps → no go.sum → nothing to cache

      - name: Run tests
        run: go test ./...

      - name: Install just
        uses: extractions/setup-just@v4

      # zig is the C cross-compiler for the tree-sitter (CGO) binaries.
      # One tool builds linux-amd64, linux-arm64 and windows-amd64. darwin
      # comes from the macOS job above, which this job waits on.
      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build and package release platforms
        run: just package

      - uses: actions/download-artifact@v8
        with:
          name: darwin-archives
          path: bin

      # Computed but NOT created here. Creating the tag before the release
      # exists means a failed release leaves an orphan tag behind, and the
      # loop below then skips it — so a re-run mints a brand new release
      # instead of retrying the failed one. See #5.
      - name: Compute next tag
        run: |
          DATE="$(date -u +%Y%m%d)"
          N=1
          while git ls-remote --tags origin "refs/tags/v0.${DATE}.${N}" 2>/dev/null | grep -q .; do
            N=$((N + 1))
          done
          echo "TAG=v0.${DATE}.${N}" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # --target creates the tag as part of creating the release, so the
          # two cannot get out of step.
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --draft

          # One archive at a time. Uploading them all concurrently is what
          # kept failing — two runs, two different errors (Headers Timeout
          # Error, then Error saving asset) with ~160MB in flight at once.
          for archive in \
            bin/claude-hooks-linux-amd64.tar.gz \
            bin/claude-hooks-linux-arm64.tar.gz \
            bin/claude-hooks-windows-amd64.tar.gz \
            bin/claude-hooks-darwin-arm64.tar.gz \
            bin/claude-hooks-darwin-amd64.tar.gz
          do
            name="$(basename "$archive")"
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$archive" --clobber; then
                echo "uploaded $name"
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::$name failed to upload after 3 attempts"
                exit 1
              fi
              echo "::warning::$name upload attempt $attempt failed, retrying"
              sleep $((attempt * 20))
            done
          done

          # Publish only once every asset is actually present. A half-populated
          # release must never become the one consumers download.
          gh release edit "$TAG" --draft=false --latest

      # Leave nothing behind. Without this a failed upload strands a draft
      # release and its tag, and the next run picks the next number rather
      # than retrying this one.
      - name: Remove failed release
        if: failure() && env.TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "$TAG" --cleanup-tag --yes || true
